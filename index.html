<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Holy Youth Movement</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overflow: hidden;
    }

    .enter-page {
      position: relative;
      width: 100%;
      height: 100dvh;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at center,
          rgba(255, 0, 235, 0.16) 0%,
          rgba(255, 0, 235, 0.07) 22%,
          rgba(0, 0, 0, 0) 52%
        ),
        #000;
    }

    .enter-content {
      width: 100%;
      padding: 30px;

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;
      transform: translateY(-2vh);
    }

    .hym-logo {
      color: #ff20ef;

      font-family: Arial Black, Arial, Helvetica, sans-serif;
      font-size: clamp(90px, 23vw, 180px);
      font-weight: 900;
      font-style: italic;

      line-height: 0.8;
      letter-spacing: -0.11em;

      margin-right: 0.11em;

      text-shadow:
        0 0 10px rgba(255, 32, 239, 0.35),
        0 0 35px rgba(255, 32, 239, 0.16);
    }

    .band-name {
      color: #fff;

      margin-top: 42px;

      font-size: clamp(14px, 4.2vw, 22px);
      font-weight: 600;
      letter-spacing: 0.32em;

      padding-left: 0.32em;

      white-space: nowrap;
    }

    .enter-button {
      margin-top: 48px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 240px;
      height: 80px;
      padding: 0 42px;

      border: 2px solid #fff;

      color: #fff;
      background: transparent;

      text-decoration: none;

      font-size: 19px;
      font-weight: 400;
      letter-spacing: 0.18em;

      transition:
        background 0.25s ease,
        color 0.25s ease,
        transform 0.25s ease;
    }

    .enter-button:hover,
    .enter-button:active {
      background: #fff;
      color: #000;
    }

    .enter-button:active {
      transform: scale(0.98);
    }

    @media (max-width: 420px) {
      .enter-content {
        padding: 22px;
      }

      .band-name {
        margin-top: 35px;
        font-size: 14px;
        letter-spacing: 0.28em;
      }

      .enter-button {
        margin-top: 42px;
        min-width: 220px;
        height: 72px;
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <main class="enter-page">

    <div class="enter-content">

      <div class="hym-logo">
        HYM
      </div>

      <div class="band-name">
        HOLY YOUTH MOVEMENT
      </div>

      <a class="enter-button" href="home.html">
        ENTER SITE
      </a>

    </div>

  </main>

</body>
</html>
