<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">

  <title>Holy Youth Movement</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    .hero-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 1;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: rgba(0, 0, 0, 0.15);
    }

    .hero-content {
      position: relative;
      z-index: 3;
      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 24px;
      text-align: center;
    }

    .hero-title {
      color: #fff;
      font-size: clamp(22px, 5vw, 48px);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .enter-button {
      margin-top: 40px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 220px;
      height: 68px;

      border: 2px solid #fff;
      background: rgba(0, 0, 0, 0.25);

      color: #fff;
      text-decoration: none;

      font-size: 15px;
      letter-spacing: 0.2em;

      transition: 0.25s ease;
    }

    .enter-button:hover {
      background: #fff;
      color: #000;
    }
  </style>
</head>

<body>

  <main class="hero">

    <video
      class="hero-video"
      autoplay
      muted
      loop
      playsinline
    >
      <source
        src="6456cc03b18521dd74a8f3ca_Short%20HYM-transcode.mp4"
        type="video/mp4"
      >
    </video>

    <div class="hero-overlay"></div>

    <div class="hero-content">

      <div class="hero-title">
        HOLY YOUTH MOVEMENT
      </div>

      <a class="enter-button" href="home.html">
        ENTER SITE
      </a>

    </div>

  </main>

</body>
</html>
