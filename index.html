<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Holy Youth Movement</title>

  <style>
    :root {
      --pink: #ff28f0;
      --white: #ffffff;
      --black: #000000;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    .landing {
      position: relative;
      width: 100%;
      height: 100dvh;
      min-height: 100vh;
      overflow: hidden;
      background: #000;
      isolation: isolate;
    }

    /* ===================================
       ANIMATED IMAGE BACKGROUND
    =================================== */

    .image-layer {
      position: absolute;
      inset: -8%;
      z-index: -10;

      background-image: url("hym-landing.png");
      background-size: cover;
      background-position: center;

      transform-origin: center;

      animation:
        cinematicMove 14s ease-in-out infinite alternate,
        brightnessPulse 6s ease-in-out infinite alternate;
    }

    @keyframes cinematicMove {
      0% {
        transform:
          scale(1.02)
          translate3d(-1.5%, -1%, 0)
          rotate(-0.5deg);
      }

      40% {
        transform:
          scale(1.10)
          translate3d(1.5%, 1%, 0)
          rotate(0.4deg);
      }

      70% {
        transform:
          scale(1.15)
          translate3d(-1%, 1.5%, 0)
          rotate(-0.2deg);
      }

      100% {
        transform:
          scale(1.08)
          translate3d(1%, -1%, 0)
          rotate(0.5deg);
      }
    }

    @keyframes brightnessPulse {
      0% {
        filter:
          brightness(.68)
          contrast(1.18)
          saturate(1.08);
      }

      100% {
        filter:
          brightness(.92)
          contrast(1.32)
          saturate(1.3);
      }
    }

    /* ===================================
       DUPLICATE GHOST LAYER
    =================================== */

    .ghost-layer {
      position: absolute;
      inset: -8%;
      z-index: -9;

      background-image: url("hym-landing.png");
      background-size: cover;
      background-position: center;

      opacity: 0;
      mix-blend-mode: screen;

      animation: ghostGlitch 8s infinite;
    }

    @keyframes ghostGlitch {
      0%,
      16%,
      18%,
      39%,
      41%,
      67%,
      69%,
      100% {
        opacity: 0;
        transform: translate(0, 0) scale(1.08);
      }

      17% {
        opacity: .24;
        transform: translate(-8px, 3px) scale(1.09);
      }

      40% {
        opacity: .18;
        transform: translate(7px, -3px) scale(1.07);
      }

      68% {
        opacity: .20;
        transform: translate(-5px, 4px) scale(1.1);
      }
    }

    /* ===================================
       DARK OVERLAY
    =================================== */

    .overlay {
      position: absolute;
      inset: 0;
      z-index: -5;

      background:
        radial-gradient(
          circle at center,
          rgba(0,0,0,.02) 0%,
          rgba(0,0,0,.08) 38%,
          rgba(0,0,0,.55) 100%
        ),
        linear-gradient(
          to bottom,
          rgba(0,0,0,.18),
          rgba(0,0,0,.38)
        );
    }

    /* ===================================
       LIGHT FLASHES
    =================================== */

    .flash {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background: rgba(255,255,255,.18);
      opacity: 0;

      animation: flashPulse 10s infinite;
    }

    @keyframes flashPulse {
      0%,
      19%,
      20%,
      46%,
      47%,
      73%,
      74%,
      100% {
        opacity: 0;
      }

      19.4% {
        opacity: .08;
      }

      46.4% {
        opacity: .05;
      }

      73.4% {
        opacity: .07;
      }
    }

    /* ===================================
       SCANLINES
    =================================== */

    .scanlines {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;

      background:
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,.02) 0px,
          rgba(255,255,255,.02) 1px,
          transparent 2px,
          transparent 4px
        );

      opacity: .25;
      mix-blend-mode: screen;
    }

    /* ===================================
       MOVING HORIZONTAL GLITCH BANDS
    =================================== */

    .glitch-band {
      position: absolute;
      left: -10%;
      width: 120%;
      height: 10px;
      z-index: 6;
      pointer-events: none;
      opacity: 0;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.7),
          rgba(255,40,240,.8),
          transparent
        );

      filter: blur(.4px);
    }

    .glitch-one {
      top: 28%;
      animation: glitchBand 7s infinite;
    }

    .glitch-two {
      top: 66%;
      animation: glitchBand 9s infinite;
      animation-delay: 2.5s;
    }

    @keyframes glitchBand {
      0%,
      72% {
        opacity: 0;
        transform: translateX(-25%);
      }

      74% {
        opacity: .7;
      }

      77% {
        transform: translateX(30%);
        opacity: .3;
      }

      80% {
        opacity: 0;
      }

      100% {
        opacity: 0;
      }
    }

    /* ===================================
       CONTENT
    =================================== */

    .content {
      position: relative;
      z-index: 20;

      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 24px;
      text-align: center;
    }

    .brand {
      margin-top: 36vh;

      color: #fff;

      font-size: clamp(13px, 4vw, 20px);
      font-weight: 600;

      letter-spacing: .32em;
      padding-left: .32em;

      white-space: nowrap;

      opacity: 0;
      transform: translateY(20px);

      animation: revealText 1s ease forwards;
      animation-delay: 1.3s;
    }

    .enter-button {
      margin-top: 42px;

      min-width: 230px;
      height: 74px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border: 2px solid rgba(255,255,255,.95);

      background: rgba(0,0,0,.26);

      backdrop-filter: blur(6px);

      color: #fff;

      text-decoration: none;

      font-size: 16px;
      letter-spacing: .2em;

      opacity: 0;
      transform: translateY(22px);

      animation: revealButton 1.1s ease forwards;
      animation-delay: 2.2s;

      transition:
        background .25s ease,
        color .25s ease,
        border-color .25s ease,
        box-shadow .25s ease,
        transform .25s ease;
    }

    .enter-button:hover {
      background: var(--pink);
      color: #000;
      border-color: var(--pink);

      box-shadow:
        0 0 18px rgba(255,40,240,.55),
        0 0 45px rgba(255,40,240,.28);
    }

    .enter-button:active {
      transform: scale(.97);
    }

    @keyframes revealText {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes revealButton {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ===================================
       EXTRA MICRO MOVEMENT
    =================================== */

    .micro-shake {
      position: absolute;
      inset: 0;
      z-index: -8;
      pointer-events: none;

      animation: microShake 5.5s steps(2) infinite;
    }

    @keyframes microShake {
      0%,
      92%,
      100% {
        transform: translate(0,0);
      }

      93% {
        transform: translate(2px,-1px);
      }

      94% {
        transform: translate(-2px,1px);
      }

      95% {
        transform: translate(1px,2px);
      }

      96% {
        transform: translate(0,0);
      }
    }

    @media (max-width: 420px) {
      .brand {
        margin-top: 33vh;
        font-size: 13px;
        letter-spacing: .28em;
      }

      .enter-button {
        min-width: 215px;
        height: 70px;
        font-size: 15px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>

  <main class="landing">

    <div class="micro-shake">
      <div class="image-layer"></div>
      <div class="ghost-layer"></div>
    </div>

    <div class="overlay"></div>
    <div class="flash"></div>
    <div class="scanlines"></div>

    <div class="glitch-band glitch-one"></div>
    <div class="glitch-band glitch-two"></div>

    <div class="content">

      <div class="brand">
        HOLY YOUTH MOVEMENT
      </div>

      <a
        class="enter-button"
        href="home.html"
      >
        ENTER SITE
      </a>

    </div>

  </main>

</body>
</html>
