<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">

  <title>Holy Youth Movement</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    /* VIDEO */

    .hero-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 1;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: rgba(0, 0, 0, 0.12);
    }

    /* CONTENT */

    .hero-content {
      position: relative;
      z-index: 3;

      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 24px;
      text-align: center;
    }

    /* HYM LOGO */

    .hero-logo {
      width: min(55vw, 340px);
      height: auto;

      opacity: 0;
      transform: scale(0);

      animation: logoEntrance 0.8s ease-out 0.4s forwards;
    }

    @keyframes logoEntrance {
      0% {
        opacity: 0;
        transform: scale(0);
      }

      70% {
        opacity: 1;
        transform: scale(1.08);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* BAND NAME */

    .title-wrap {
      position: relative;
      margin-top: 22px;

      opacity: 0;
      transform: scale(0);

      animation: titleEntrance 0.7s ease-out 1.05s forwards;
    }

    @keyframes titleEntrance {
      0% {
        opacity: 0;
        transform: scale(0);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .hero-title {
      position: relative;

      color: #fff;

      font-size: clamp(20px, 5vw, 46px);
      font-weight: 700;

      letter-spacing: 0.1em;
      line-height: 1;

      white-space: nowrap;
    }

    /* GLITCH COPIES */

    .hero-title::before,
    .hero-title::after {
      content: "HOLY YOUTH MOVEMENT";

      position: absolute;
      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      opacity: 0;
      pointer-events: none;
    }

    .hero-title::before {
      text-shadow: -3px 0 #ff00c8;
      animation: glitchOne 3s infinite 2s;
    }

    .hero-title::after {
      text-shadow: 3px 0 #00ffff;
      animation: glitchTwo 3s infinite 2s;
    }

    @keyframes glitchOne {
      0%, 88%, 100% {
        opacity: 0;
        transform: translate(0);
      }
