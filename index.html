<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holy Youth Movement</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 140px;
    }

    /* VIDEO */

    .hero-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    /* FOREGROUND */

    .hero-content {
      position: relative;
      z-index: 2;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* HYM LOGO */

    .hym-logo {
      width: min(100vw, 468px);
      height: auto;
      display: block;

      transform: scale(0);
      animation: logo-in 0.65s ease-out 0.35s forwards;
    }

    @keyframes logo-in {
      0% {
        transform: scale(0);
      }

      75% {
        transform: scale(1.08);
      }

      100% {
        transform: scale(1);
      }
    }

    /* TITLE */

    .title-wrapper {
      max-width: 100%;
      padding: 0 10px;
      overflow: hidden;

      transform: scale(0);
      animation: title-in 0.55s ease-out 0.95s forwards;
    }

    .glitched {
      --duration: 1s;

      position: relative;

      color: #fff;
      text-align: center;
      text-transform: uppercase;

      /*
        No downloaded font.
        We're deliberately abusing a heavy system font instead.
      */
      font-family: Impact, Haettenschweiler,
                   "Arial Narrow Bold", "Arial Black",
                   sans-serif;

      font-size: 50px;
      font-weight: 900;
      line-height: 1.05;

      /*
        Make the ordinary font narrower, taller and slightly
        slanted to push it towards the HYM appearance.
      */
      letter-spacing: -2px;
      transform: scaleX(0.82) skewX(-7deg);

      animation: glitch var(--duration) linear infinite;
    }

    .glitched::before,
    .glitched::after {
      content: attr(data-text);
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      color: #fff;
    }

    .glitched::before {
      animation: glitch-top var(--duration) linear infinite;
      clip-path: polygon(
        0 0,
        100% 0,
        100% 33%,
        0 33%
      );
    }

    .glitched::after {
      animation: glitch-bottom var(--duration) linear infinite;
      clip-path: polygon(
        0 67%,
        100% 67%,
        100% 100%,
        0 100%
      );
    }

    /*
      Based directly on the original site's glitch movement.
    */

    @keyframes glitch {
      2%, 64% {
        transform:
          scaleX(0.82)
          skewX(-7deg)
          translate(2px, 0);
      }

      4%, 60% {
        transform:
          scaleX(0.82)
          skewX(-7deg)
          translate(-2px, 0);
      }

      62% {
        transform:
          scaleX(0.82)
          skewX(-2deg);
      }
    }

    @keyframes glitch-top {
      2%, 64% {
        transform: translate(2px, -2px);
      }

      4%, 60% {
        transform: translate(-2px, 2px);
      }

      62% {
        transform: translate(13px, -1px) skew(-13deg);
      }
    }

    @keyframes glitch-bottom {
      2%, 64% {
        transform: translate(-2px, 0);
      }

      4%, 60% {
        transform: translate(-2px, 0);
      }

      62% {
        transform: translate(-22px, 5px) skew(21deg);
      }
    }

    @keyframes title-in {
      from {
        transform: scale(0);
      }

      to {
        transform: scale(1);
      }
    }

    /* ENTER SITE */

    .enter-site {
      position: absolute;
      z-index: 3;

      left: 50%;
      bottom: 25%;

      color: #fff;
      background: transparent;

      border: 5px solid #fb38fc;

      padding: 3px 20px 5px;

      text-decoration: none;
      text-transform: uppercase;
      white-space: nowrap;

      font-family: Impact, Haettenschweiler,
                   "Arial Narrow Bold", "Arial Black",
                   sans-serif;

      font-size: 30px;
      font-weight: 900;
      line-height: 30px;
      letter-spacing: -1px;

      transform:
        translateX(-50%)
        scale(0)
        skewX(-6deg);

      animation: button-in 0.5s ease-out 1.5s forwards;
    }

    .enter-site:hover {
      color: #fb38fc;
    }

    @keyframes button-in {
      from {
        transform:
          translateX(-50%)
          scale(0)
          skewX(-6deg);
      }

      to {
        transform:
          translateX(-50%)
          scale(1)
          skewX(-6deg);
      }
    }

    /*
      Desktop / larger screens.
      The original desktop title was 4rem.
    */

    @media screen and (min-width: 480px) {
      .hero {
        justify-content: center;
        padding-top: 0;
      }

      .glitched {
        font-size: 4rem;
      }

      .enter-site {
        bottom: 40px;
      }
    }
  </style>
</head>

<body>

  <main class="hero">

    <video
      class="hero-video"
      autoplay
      loop
      muted
      playsinline
    >
      <source
        src="6456cc03b18521dd74a8f3ca_Short%20HYM-transcode.mp4"
        type="video/mp4"
      >
    </video>

    <div class="hero-content">

      <img
        class="hym-logo"
        src="hymlogo.png"
        alt="Holy Youth Movement"
      >

      <div class="title-wrapper">
        <div
          class="glitched"
          data-text="HOLY YOUTH MOVEMENT"
        >
          HOLY YOUTH MOVEMENT
        </div>
      </div>

    </div>

    <a class="enter-site" href="home.html">
      ENTER SITE
    </a>

  </main>

</body>
</html>
