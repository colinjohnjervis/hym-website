<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Holy Youth Movement</title>

  <style>
    :root {
      --pink: #ff20ef;
      --purple: #7b00ff;
      --white: #ffffff;
      --black: #000000;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    .landing {
      position: relative;
      width: 100%;
      height: 100dvh;
      min-height: 100vh;
      overflow: hidden;
      background: #000;
      isolation: isolate;
    }

    /* ==============================
       BASE BACKGROUND
    ============================== */

    .scene {
      position: absolute;
      inset: -15%;
      z-index: -10;

      background:
        radial-gradient(circle at 20% 30%, rgba(255, 32, 239, .18), transparent 30%),
        radial-gradient(circle at 75% 70%, rgba(123, 0, 255, .16), transparent 32%),
        linear-gradient(135deg, #020002 0%, #12000f 35%, #020202 70%, #09000b 100%);

      animation: sceneMove 10s ease-in-out infinite alternate;
    }

    @keyframes sceneMove {
      0% {
        transform: scale(1) translate(-2%, -1%) rotate(-1deg);
      }

      50% {
        transform: scale(1.08) translate(2%, 1%) rotate(.5deg);
      }

      100% {
        transform: scale(1.15) translate(-1%, 3%) rotate(1deg);
      }
    }

    /* ==============================
       BIG MOVING LIGHTS
    ============================== */

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(65px);
      mix-blend-mode: screen;
      opacity: .45;
      z-index: -6;
      pointer-events: none;
    }

    .orb-one {
      width: 55vw;
      height: 55vw;
      min-width: 300px;
      min-height: 300px;

      left: -20%;
      top: 5%;

      background: var(--pink);

      animation: orbOne 8s ease-in-out infinite alternate;
    }

    .orb-two {
      width: 46vw;
      height: 46vw;
      min-width: 260px;
      min-height: 260px;

      right: -18%;
      bottom: 5%;

      background: var(--purple);

      animation: orbTwo 9s ease-in-out infinite alternate;
    }

    .orb-three {
      width: 38vw;
      height: 38vw;
      min-width: 220px;
      min-height: 220px;

      left: 30%;
      bottom: -15%;

      background: rgba(255, 255, 255, .16);

      animation: orbThree 7s ease-in-out infinite alternate;
    }

    @keyframes orbOne {
      from {
        transform: translate(0, 0) scale(.9);
      }

      to {
        transform: translate(55vw, 24vh) scale(1.25);
      }
    }

    @keyframes orbTwo {
      from {
        transform: translate(0, 0) scale(1.15);
      }

      to {
        transform: translate(-50vw, -28vh) scale(.85);
      }
    }

    @keyframes orbThree {
      from {
        transform: translate(-10vw, 0) scale(.8);
      }

      to {
        transform: translate(25vw, -45vh) scale(1.35);
      }
    }

    /* ==============================
       SWEEPING LIGHT BEAMS
    ============================== */

    .beam {
      position: absolute;
      width: 140%;
      height: 14vh;
      left: -20%;
      z-index: -4;
      opacity: .55;
      mix-blend-mode: screen;
      filter: blur(18px);
      pointer-events: none;
    }

    .beam-one {
      top: 14%;
      background:
        linear-gradient(
          90deg,
          transparent 0%,
          rgba(255,32,239,.04) 20%,
          rgba(255,32,239,.7) 48%,
          rgba(255,255,255,.18) 52%,
          transparent 80%
        );

      transform: rotate(-18deg);
      animation: beamOne 5.5s linear infinite;
    }

    .beam-two {
      top: 58%;

      background:
        linear-gradient(
          90deg,
          transparent 0%,
          rgba(123,0,255,.08) 20%,
          rgba(123,0,255,.62) 50%,
          rgba(255,32,239,.35) 58%,
          transparent 82%
        );

      transform: rotate(14deg);
      animation: beamTwo 6.5s linear infinite;
    }

    @keyframes beamOne {
      0% {
        transform: translateX(-65%) rotate(-18deg);
      }

      100% {
        transform: translateX(65%) rotate(-18deg);
      }
    }

    @keyframes beamTwo {
      0% {
        transform: translateX(60%) rotate(14deg);
      }

      100% {
        transform: translateX(-60%) rotate(14deg);
      }
    }

    /* ==============================
       FAST FLASH LINES
    ============================== */

    .flash-line {
      position: absolute;
      width: 160%;
      height: 2px;
      left: -30%;
      z-index: -2;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.85),
          rgba(255,32,239,.85),
          transparent
        );

      filter: blur(.4px);
      opacity: 0;
      pointer-events: none;
    }

    .flash-one {
      top: 26%;
      transform: rotate(-9deg);
      animation: flashLine 4.2s linear infinite;
    }

    .flash-two {
      top: 72%;
      transform: rotate(7deg);
      animation: flashLine 5.3s linear infinite;
      animation-delay: 1.7s;
    }

    @keyframes flashLine {
      0%,
      70% {
        transform: translateX(-70%) rotate(-9deg);
        opacity: 0;
      }

      74% {
        opacity: 1;
      }

      82% {
        transform: translateX(65%) rotate(-9deg);
        opacity: .2;
      }

      100% {
        opacity: 0;
      }
    }

    /* ==============================
       STROBE / SCREEN FLASH
    ============================== */

    .strobe {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: #fff;
      opacity: 0;

      animation: strobe 9s infinite;
    }

    @keyframes strobe {
      0%,
      17%,
      18%,
      43%,
      44%,
      68%,
      69%,
      100% {
        opacity: 0;
      }

      17.4% {
        opacity: .09;
      }

      43.5% {
        opacity: .05;
      }

      68.5% {
        opacity: .08;
      }
    }

    /* ==============================
       GRAIN
    ============================== */

    .grain {
      position: absolute;
      inset: -70%;
      z-index: 5;
      pointer-events: none;

      background-image:
        repeating-radial-gradient(
          circle at 0 0,
          transparent 0,
          rgba(255,255,255,.32) 1px,
          transparent 2px
        );

      background-size: 4px 4px;

      opacity: .14;
      mix-blend-mode: screen;

      animation: grainMove .16s steps(2) infinite;
    }

    @keyframes grainMove {
      0% {
        transform: translate(0, 0);
      }

      25% {
        transform: translate(3%, -4%);
      }

      50% {
        transform: translate(-4%, 2%);
      }

      75% {
        transform: translate(2%, 4%);
      }

      100% {
        transform: translate(-3%, -2%);
      }
    }

    /* ==============================
       VIGNETTE
    ============================== */

    .vignette {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;

      background:
        radial-gradient(
          circle at center,
          transparent 26%,
          rgba(0,0,0,.12) 50%,
          rgba(0,0,0,.78) 100%
        );
    }

    /* ==============================
       MAIN CONTENT
    ============================== */

    .content {
      position: relative;
      z-index: 20;

      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 24px;
      text-align: center;
    }

    .logo-wrap {
      opacity: 0;
      transform: scale(.7);
      filter: blur(14px);

      animation: logoReveal 1.5s cubic-bezier(.2,.8,.2,1) forwards;
      animation-delay: .8s;
    }

    @keyframes logoReveal {
      0% {
        opacity: 0;
        transform: scale(.65);
        filter: blur(16px);
      }

      60% {
        opacity: 1;
        transform: scale(1.07);
        filter: blur(0);
      }

      100% {
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
      }
    }

    .hym {
      color: var(--pink);

      font-family: Arial Black, Arial, Helvetica, sans-serif;
      font-size: clamp(92px, 24vw, 190px);
      font-style: italic;
      font-weight: 900;

      line-height: .76;
      letter-spacing: -.12em;

      padding-right: .1em;

      text-shadow:
        0 0 10px rgba(255,32,239,.62),
        0 0 28px rgba(255,32,239,.34),
        0 0 80px rgba(255,32,239,.2);

      animation: logoPulse 3.8s ease-in-out infinite alternate;
    }

    @keyframes logoPulse {
      from {
        transform: scale(1);
        text-shadow:
          0 0 8px rgba(255,32,239,.45),
          0 0 22px rgba(255,32,239,.28),
          0 0 60px rgba(255,32,239,.14);
      }

      to {
        transform: scale(1.03);
        text-shadow:
          0 0 14px rgba(255,32,239,.8),
          0 0 38px rgba(255,32,239,.5),
          0 0 95px rgba(255,32,239,.26);
      }
    }

    .band-name {
      margin-top: 42px;

      color: #fff;

      font-size: clamp(13px, 3.9vw, 20px);
      font-weight: 600;

      letter-spacing: .32em;
      padding-left: .32em;

      white-space: nowrap;

      opacity: 0;
      transform: translateY(20px);

      animation: nameReveal 1s ease forwards;
      animation-delay: 1.8s;
    }

    @keyframes nameReveal {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .enter-button {
      margin-top: 48px;

      min-width: 235px;
      height: 76px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border: 2px solid rgba(255,255,255,.92);

      background: rgba(0,0,0,.2);

      backdrop-filter: blur(6px);

      color: #fff;

      text-decoration: none;

      font-size: 17px;
      letter-spacing: .2em;

      opacity: 0;
      transform: translateY(22px);

      animation: buttonReveal 1.2s ease forwards;
      animation-delay: 2.7s;

      transition:
        background .25s ease,
        border-color .25s ease,
        color .25s ease,
        box-shadow .25s ease,
        transform .25s ease;
    }

    @keyframes buttonReveal {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .enter-button:hover {
      background: var(--pink);
      border-color: var(--pink);
      color: #000;

      box-shadow:
        0 0 18px rgba(255,32,239,.5),
        0 0 48px rgba(255,32,239,.25);
    }

    .enter-button:active {
      transform: scale(.97);
    }

    /* ==============================
       BOTTOM DETAIL
    ============================== */

    .bottom-line {
      position: absolute;
      left: 50%;
      bottom: 18px;

      width: 1px;
      height: 50px;

      z-index: 20;

      background:
        linear-gradient(
          to bottom,
          rgba(255,255,255,.7),
          transparent
        );

      opacity: 0;

      animation: lineReveal 1s ease forwards;
      animation-delay: 3.3s;
    }

    @keyframes lineReveal {
      to {
        opacity: .7;
        transform: translateX(-50%);
      }
    }

    @media (max-width: 420px) {
      .content {
        padding: 20px;
      }

      .band-name {
        margin-top: 36px;
        font-size: 13px;
        letter-spacing: .27em;
      }

      .enter-button {
        margin-top: 42px;
        min-width: 215px;
        height: 70px;
        font-size: 15px;
      }

      .orb {
        filter: blur(45px);
      }

      .beam {
        height: 16vh;
        filter: blur(13px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>

  <main class="landing">

    <div class="scene"></div>

    <div class="orb orb-one"></div>
    <div class="orb orb-two"></div>
    <div class="orb orb-three"></div>

    <div class="beam beam-one"></div>
    <div class="beam beam-two"></div>

    <div class="flash-line flash-one"></div>
    <div class="flash-line flash-two"></div>

    <div class="strobe"></div>
    <div class="vignette"></div>
    <div class="grain"></div>

    <div class="content">

      <div class="logo-wrap">
        <div class="hym">
          HYM
        </div>
      </div>

      <div class="band-name">
        HOLY YOUTH MOVEMENT
      </div>

      <a
        class="enter-button"
        href="home.html"
      >
        ENTER SITE
      </a>

    </div>

    <div class="bottom-line"></div>

  </main>

</body>
</html>
