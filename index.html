<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holy Youth Movement</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;

      padding-top: 140px;
    }

    /* =========================
       VIDEO
       ========================= */

    .hero-video {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      z-index: 0;
    }

    /* =========================
       FOREGROUND CONTENT
       ========================= */

    .hero-content {
      position: relative;
      z-index: 2;

      width: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* =========================
       HYM LOGO
       ========================= */

    .hym-logo {
      width: min(100vw, 468px);
      height: auto;

      display: block;

      transform: scale(0);

      animation:
        logo-in 0.65s ease-out 0.35s forwards;
    }

    @keyframes logo-in {
      0% {
        transform: scale(0);
      }

      75% {
        transform: scale(1.08);
      }

      100% {
        transform: scale(1);
      }
    }

    /* =========================
       TITLE
       ========================= */

    .title-wrapper {
      max-width: 100%;

      padding-left: 10px;
      padding-right: 10px;

      overflow: hidden;

      transform: scale(0);

      animation:
        title-in 0.55s ease-out 0.95s forwards;
    }

    @keyframes title-in {
      from {
        transform: scale(0);
      }

      to {
        transform: scale(1);
      }
    }

    /*
      We are deliberately using a system font here.

      CSS stretching, skewing and slicing are used
      to move it towards the original HYM appearance
      without requiring the original font file.
    */

    .glitched {
      --duration: 1s;

      position: relative;
      display: inline-block;

      color: #fff;

      text-align: center;
      text-transform: uppercase;

      font-family:
        Impact,
        Haettenschweiler,
        "Arial Black",
        sans-serif;

      font-size: 50px;
      font-weight: 900;
      line-height: 1.12;

      letter-spacing: -1px;

      transform:
        scaleX(1.04)
        skewX(-5deg);

      animation:
        glitch var(--duration) linear infinite;
    }

    /*
      Duplicate copies of the title are sliced.
      These create the broken/distorted sections
      through the lettering.
    */

    .glitched::before,
    .glitched::after {
      content: attr(data-text);

      position: absolute;

      left: 0;
      top: 0;

      width: 100%;

      color: #fff;

      text-align: center;

      font: inherit;
      letter-spacing: inherit;

      pointer-events: none;
    }

    /*
      Upper slice
    */

    .glitched::before {
      clip-path: polygon(
        0 0,
        100% 0,
        100% 42%,
        0 42%
      );

      transform: translateX(3px);

      animation:
        slice-top 2.4s steps(1) infinite,
        glitch-top var(--duration) linear infinite;
    }

    /*
      Lower slice
    */

    .glitched::after {
      clip-path: polygon(
        0 62%,
        100% 62%,
        100% 100%,
        0 100%
      );

      transform: translateX(-3px);

      animation:
        slice-bottom 2.1s steps(1) infinite,
        glitch-bottom var(--duration) linear infinite;
    }

    /* =========================
       MAIN GLITCH
       ========================= */

    @keyframes glitch {
      0%,
      1%,
      5%,
      59%,
      65%,
      100% {
        transform:
          scaleX(1.04)
          skewX(-5deg);
      }

      2%,
      64% {
        transform:
          scaleX(1.04)
          skewX(-5deg)
          translate(2px, 0);
      }

      4%,
      60% {
        transform:
          scaleX(1.04)
          skewX(-5deg)
          translate(-2px, 0);
      }

      62% {
        transform:
          scaleX(1.04)
          skewX(2deg)
          translate(0, 0);
      }
    }

    /*
      Original-style upper glitch movement
    */

    @keyframes glitch-top {
      2%,
      64% {
        transform:
          translate(2px, -2px);
      }

      4%,
      60% {
        transform:
          translate(-2px, 2px);
      }

      62% {
        transform:
          translate(13px, -1px)
          skew(-13deg);
      }
    }

    /*
      Original-style lower glitch movement
    */

    @keyframes glitch-bottom {
      2%,
      64% {
        transform:
          translate(-2px, 0);
      }

      4%,
      60% {
        transform:
          translate(-2px, 0);
      }

      62% {
        transform:
          translate(-22px, 5px)
          skew(21deg);
      }
    }

    /*
      Additional permanent-ish distortion.
      This stops the normal system font from
      looking completely clean between glitches.
    */

    @keyframes slice-top {
      0%,
      79%,
      100% {
        transform: translateX(3px);
      }

      80%,
      84% {
        transform: translateX(-5px);
      }

      85%,
      89% {
        transform: translateX(6px);
      }
    }

    @keyframes slice-bottom {
      0%,
      74%,
      100% {
        transform: translateX(-3px);
      }

      75%,
      80% {
        transform: translateX(5px);
      }

      81%,
      86% {
        transform: translateX(-7px);
      }
    }

    /* =========================
       ENTER SITE BUTTON
       ========================= */

    .enter-site {
      position: absolute;

      z-index: 3;

      left: 50%;
      bottom: 25%;

      color: #fff;

      background: transparent;

      border:
        5px solid #fb38fc;

      padding:
        3px 20px 5px;

      text-decoration: none;
      text-transform: uppercase;

      white-space: nowrap;

      font-family:
        Impact,
        Haettenschweiler,
        "Arial Black",
        sans-serif;

      font-size: 30px;
      font-weight: 900;
      line-height: 30px;

      letter-spacing: 0;

      transform:
        translateX(-50%)
        scale(0)
        skewX(-5deg);

      animation:
        button-in 0.5s ease-out 1.5s forwards;
    }

    .enter-site:hover {
      color: #fb38fc;
    }

    @keyframes button-in {
      from {
        transform:
          translateX(-50%)
          scale(0)
          skewX(-5deg);
      }

      to {
        transform:
          translateX(-50%)
          scale(1)
          skewX(-5deg);
      }
    }

    /* =========================
       DESKTOP / LARGER SCREENS
       ========================= */

    @media screen and (min-width: 480px) {

      .hero {
        justify-content: center;
        padding-top: 0;
      }

      .glitched {
        font-size: 4rem;
      }

      .enter-site {
        bottom: 40px;
      }
    }

  </style>
</head>

<body>

  <main class="hero">

    <video
      class="hero-video"
      autoplay
      loop
      muted
      playsinline
    >
      <source
        src="6456cc03b18521dd74a8f3ca_Short%20HYM-transcode.mp4"
        type="video/mp4"
      >
    </video>

    <div class="hero-content">

      <img
        class="hym-logo"
        src="hymlogo.png"
        alt="Holy Youth Movement"
      >

      <div class="title-wrapper">

        <div
          class="glitched"
          data-text="HOLY YOUTH MOVEMENT"
        >
          HOLY YOUTH MOVEMENT
        </div>

      </div>

    </div>

    <a
      class="enter-site"
      href="home.html"
    >
      ENTER SITE
    </a>

  </main>

</body>
</html>
