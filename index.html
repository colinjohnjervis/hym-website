<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#000000"
  >

  <title>Holy Youth Movement</title>

  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;

      padding-top: 140px;
    }

    .hero-video {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      z-index: 0;
    }

    .hero-content {
      position: relative;
      z-index: 2;

      width: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hym-logo {
      display: block;

      width: min(100vw, 468px);
      height: auto;

      transform: scale(0);

      animation:
        logo-in
        .65s
        ease-out
        3.5s
        forwards;
    }

    @keyframes logo-in {

      0% {
        transform: scale(0);
      }

      75% {
        transform: scale(1.08);
      }

      100% {
        transform: scale(1);
      }

    }

    .title-wrapper {
      position: relative;
      z-index: 3;

      width: 100%;

      padding-left: 10px;
      padding-right: 10px;

      display: flex;
      justify-content: center;

      transform: scale(0);

      animation:
        title-in
        .55s
        ease-out
        4.45s
        forwards;
    }

    @keyframes title-in {

      from {
        transform: scale(0);
      }

      to {
        transform: scale(1);
      }

    }

    .slice-heading {
      position: relative;

      margin-left: auto;
      margin-right: auto;

      color: transparent;

      text-align: center;

      font-family:
        "Archivo Black",
        "Arial Black",
        Arial,
        sans-serif;

      font-weight: 400;

      line-height: .78;

      letter-spacing: -.085em;

      text-transform: uppercase;

      transform: skewX(-7deg);

      transform-origin: center;
    }

    .slice-heading span {
      position: relative;
      display: block;

      min-height: .86em;

      color: transparent;

      white-space: nowrap;
    }

    .slice-heading span::before,
    .slice-heading span::after {
      content: attr(data-text);

      position: absolute;

      top: 0;
      left: 50%;

      width: max-content;
      min-width: 100%;

      color: #ffffff;

      font-family: inherit;
      font-size: inherit;
      font-weight: inherit;
      line-height: inherit;
      letter-spacing: inherit;

      -webkit-text-stroke: 1.5px #ffffff;

      paint-order: stroke fill;

      text-align: center;

      white-space: nowrap;
    }

    .slice-heading span::before {
      clip-path:
        polygon(
          0 0,
          100% 0,
          100% 48%,
          0 57%
        );

      transform:
        translateX(
          calc(-50% - 2px)
        );
    }

    .slice-heading span::after {
      clip-path:
        polygon(
          0 57%,
          100% 48%,
          100% 100%,
          0 100%
        );

      transform:
        translateX(
          calc(-50% + 2px)
        );
    }

    .hero-title span::before {
      animation:
        title-glitch-top
        1s
        linear
        infinite;
    }

    .hero-title span::after {
      animation:
        title-glitch-bottom
        1s
        linear
        infinite;
    }

    @keyframes title-glitch-top {

      0%,
      1%,
      5%,
      59%,
      61%,
      63%,
      65%,
      100% {
        transform:
          translateX(
            calc(-50% - 2px)
          );
      }

      2%,
      64% {
        transform:
          translate(
            calc(-50% + 0px),
            -2px
          );
      }

      4%,
      60% {
        transform:
          translate(
            calc(-50% - 4px),
            2px
          );
      }

      62% {
        transform:
          translate(
            calc(-50% + 11px),
            -1px
          )
          skewX(-13deg);
      }

    }

    @keyframes title-glitch-bottom {

      0%,
      1%,
      5%,
      59%,
      61%,
      63%,
      65%,
      100% {
        transform:
          translateX(
            calc(-50% + 2px)
          );
      }

      2%,
      64% {
        transform:
          translateX(
            calc(-50% + 0px)
          );
      }

      4%,
      60% {
        transform:
          translateX(
            calc(-50% + 4px)
          );
      }

      62% {
        transform:
          translate(
            calc(-50% - 20px),
            5px
          )
          skewX(21deg);
      }

    }

    .hero-title {
      width: 100%;
      font-size: 50px;
    }

    .hero-title span + span {
      margin-top: 8px;
    }


    /* =========================
       ENTRANCE CONTROLS
    ========================= */

    .entrance-controls {
      position: absolute;

      z-index: 4;

      left: 50%;
      bottom: 25%;

      display: flex;
      flex-direction: column;

      align-items: center;

      gap: 12px;

      transform:
        translateX(-50%)
        scale(0);

      animation:
        controls-in
        .5s
        ease-out
        5s
        forwards;
    }

    @keyframes controls-in {

      from {
        transform:
          translateX(-50%)
          scale(0);
      }

      to {
        transform:
          translateX(-50%)
          scale(1);
      }

    }


    /* =========================
       BUTTONS
    ========================= */

    .entrance-button {
      min-width: 235px;

      padding:
        7px
        20px
        9px;

      border:
        5px solid
        #fb38fc;

      background: transparent;

      color: #ffffff;

      font-family:
        "Archivo Black",
        "Arial Black",
        Arial,
        sans-serif;

      font-size: 25px;
      font-weight: 400;

      line-height: 30px;

      letter-spacing: -.04em;

      text-align: center;

      text-transform: uppercase;

      text-decoration: none;

      cursor: pointer;

      white-space: nowrap;

      appearance: none;
      -webkit-appearance: none;

      -webkit-tap-highlight-color: transparent;
    }

    .entrance-button:hover,
    .entrance-button:active,
    .entrance-button:focus,
    .entrance-button:visited {
      color: #ffffff;
    }

    .entrance-button:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 4px;
    }


    /* =========================
       DESKTOP
    ========================= */

    @media screen and (min-width: 480px) {

      .hero {
        justify-content: center;
        padding-top: 0;
      }

      .hero-title {
        font-size: 4rem;
      }

      .entrance-controls {
        bottom: 40px;

        flex-direction: row;

        gap: 16px;
      }

    }

  </style>

</head>


<body>


  <main class="hero">


    <!-- BACKGROUND VIDEO -->

    <video
      class="hero-video"
      autoplay
      loop
      muted
      playsinline
    >

      <source
        src="6456cc03b18521dd74a8f3ca_Short%20HYM-transcode.mp4"
        type="video/mp4"
      >

    </video>


    <!-- LOGO + TITLE -->

    <div class="hero-content">


      <img
        class="hym-logo"
        src="hymlogo.png"
        alt="Holy Youth Movement"
      >


      <div class="title-wrapper">


        <div
          class="slice-heading hero-title"
          aria-label="Holy Youth Movement"
        >


          <span data-text="HOLY YOUTH">
            HOLY YOUTH
          </span>


          <span data-text="MOVEMENT">
            MOVEMENT
          </span>


        </div>


      </div>


    </div>


    <!-- CONTROLS -->

    <div class="entrance-controls">


      <button
        class="entrance-button"
        id="soundButton"
        type="button"
        aria-pressed="false"
      >
        SOUND ON
      </button>


      <a
        class="entrance-button"
        href="home.html"
      >
        ENTER SITE
      </a>


    </div>


  </main>


  <!-- HYM AUDIO -->

  <audio
    id="landingAudio"
    preload="metadata"
    loop
  >
    <source
      src="holy-youth-movement-you-thought-i-was-dead-but-baby-i-m-just-getting-started_j7rAhp01.mp3"
      type="audio/mpeg"
    >
  </audio>


  <script>

    const soundButton =
      document.getElementById("soundButton");

    const landingAudio =
      document.getElementById("landingAudio");


    let soundIsOn = false;


    /*
      SOUND ON
    */

    async function turnSoundOn() {

      try {

        await landingAudio.play();

        soundIsOn = true;

        soundButton.textContent =
          "SOUND OFF";

        soundButton.setAttribute(
          "aria-pressed",
          "true"
        );

      }

      catch (error) {

        soundIsOn = false;

        soundButton.textContent =
          "SOUND ON";

        soundButton.setAttribute(
          "aria-pressed",
          "false"
        );

      }

    }


    /*
      SOUND OFF
    */

    function turnSoundOff() {

      landingAudio.pause();

      soundIsOn = false;

      soundButton.textContent =
        "SOUND ON";

      soundButton.setAttribute(
        "aria-pressed",
        "false"
      );

    }


    /*
      BUTTON TOGGLE
    */

    soundButton.addEventListener(
      "click",
      async function () {

        if (soundIsOn) {

          turnSoundOff();

        }

        else {

          await turnSoundOn();

        }

      }
    );

  </script>


</body>

</html>
