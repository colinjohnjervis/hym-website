<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#000000"
  >

  <title>Holy Youth Movement</title>

  <!-- Same font used by our earlier sliced headings -->
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap"
  >

  <style>

    /* =========================
       RESET
    ========================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;

      overflow: hidden;

      background: #000;
    }


    /* =========================
       HERO
    ========================= */

    .hero {
      position: relative;

      width: 100%;
      height: 100vh;

      overflow: hidden;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;

      padding-top: 140px;
    }


    /* =========================
       VIDEO
    ========================= */

    .hero-video {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      z-index: 0;
    }


    /* =========================
       HERO CONTENT
    ========================= */

    .hero-content {
      position: relative;

      z-index: 2;

      width: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;
    }


    /* =========================
       HYM LOGO
    ========================= */

    .hym-logo {
      display: block;

      width: min(100vw, 468px);
      height: auto;

      transform: scale(0);

      animation:
        logo-in
        .65s
        ease-out
        .35s
        forwards;
    }


    @keyframes logo-in {

      0% {
        transform: scale(0);
      }

      75% {
        transform: scale(1.08);
      }

      100% {
        transform: scale(1);
      }

    }


    /* =========================
       TITLE ENTRANCE
    ========================= */

    .title-wrapper {
      position: relative;

      z-index: 3;

      width: 100%;

      padding-left: 10px;
      padding-right: 10px;

      display: flex;
      justify-content: center;

      transform: scale(0);

      animation:
        title-in
        .55s
        ease-out
        .95s
        forwards;
    }


    @keyframes title-in {

      from {
        transform: scale(0);
      }

      to {
        transform: scale(1);
      }

    }


    /* ==================================================
       SLICED HEADING

       This uses the same basic recipe as the headings
       from the earlier HYM prototype:

       Archivo Black
       -10 degree skew
       tight letter spacing
       diagonal centre slice

       The slice direction has now been REVERSED:
       TOP    = left
       BOTTOM = right
    ================================================== */

    .slice-heading {
      position: relative;

      margin-left: auto;
      margin-right: auto;

      color: transparent;

      text-align: center;

      font-family:
        "Archivo Black",
        "Arial Black",
        Arial,
        sans-serif;

      font-weight: 400;

      line-height: .78;

      letter-spacing: -.075em;

      text-transform: uppercase;

      transform:
        skewX(-10deg);

      transform-origin: center;
    }


    .slice-heading span {
      position: relative;

      display: block;

      min-height: .86em;

      color: transparent;
    }


    .slice-heading span::before,
    .slice-heading span::after {
      content:
        attr(data-text);

      position: absolute;

      top: 0;
      left: 50%;

      width: max-content;

      min-width: 100%;

      color: #ffffff;

      font-family: inherit;
      font-size: inherit;
      font-weight: inherit;
      line-height: inherit;
      letter-spacing: inherit;

      text-align: center;

      white-space: nowrap;
    }


    /* =========================
       TOP HALF

       Reversed from the earlier CSS:
       upper portion moves LEFT.
    ========================= */

    .slice-heading span::before {
      clip-path:
        polygon(
          0 0,
          100% 0,
          100% 48%,
          0 57%
        );

      transform:
        translateX(
          calc(-50% - 2px)
        );
    }


    /* =========================
       BOTTOM HALF

       Lower portion moves RIGHT.
    ========================= */

    .slice-heading span::after {
      clip-path:
        polygon(
          0 57%,
          100% 48%,
          100% 100%,
          0 100%
        );

      transform:
        translateX(
          calc(-50% + 2px)
        );
    }


    /* =========================
       HERO TITLE
    ========================= */

    .hero-title {
      width: 100%;

      font-size: 50px;
    }


    .hero-title span + span {
      margin-top: 8px;
    }


    /* =========================
       ENTER SITE BUTTON
    ========================= */

    .enter-site {
      position: absolute;

      z-index: 4;

      left: 50%;
      bottom: 25%;

      padding:
        3px
        20px
        5px;

      border:
        5px solid
        #fb38fc;

      background: transparent;

      text-decoration: none;

      transform:
        translateX(-50%)
        scale(0);

      animation:
        button-in
        .5s
        ease-out
        1.5s
        forwards;
    }


    @keyframes button-in {

      from {
        transform:
          translateX(-50%)
          scale(0);
      }

      to {
        transform:
          translateX(-50%)
          scale(1);
      }

    }


    /* =========================
       SLICED BUTTON TEXT
    ========================= */

    .button-slice {
      position: relative;

      display: block;

      min-width: 195px;
      min-height: 30px;

      color: transparent;

      font-family:
        "Archivo Black",
        "Arial Black",
        Arial,
        sans-serif;

      font-size: 30px;
      font-weight: 400;

      line-height: 30px;

      letter-spacing: -.075em;

      text-align: center;

      text-transform: uppercase;

      transform:
        skewX(-10deg);
    }


    .button-slice::before,
    .button-slice::after {
      content:
        attr(data-text);

      position: absolute;

      top: 0;
      left: 50%;

      width: max-content;

      color: #ffffff;

      font-family: inherit;
      font-size: inherit;
      font-weight: inherit;
      line-height: inherit;
      letter-spacing: inherit;

      white-space: nowrap;
    }


    /* BUTTON TOP — LEFT */

    .button-slice::before {
      clip-path:
        polygon(
          0 0,
          100% 0,
          100% 48%,
          0 57%
        );

      transform:
        translateX(
          calc(-50% - 2px)
        );
    }


    /* BUTTON BOTTOM — RIGHT */

    .button-slice::after {
      clip-path:
        polygon(
          0 57%,
          100% 48%,
          100% 100%,
          0 100%
        );

      transform:
        translateX(
          calc(-50% + 2px)
        );
    }


    .enter-site:hover
    .button-slice::before,

    .enter-site:hover
    .button-slice::after {
      color: #fb38fc;
    }


    /* =========================
       DESKTOP
    ========================= */

    @media screen and (min-width: 480px) {

      .hero {
        justify-content: center;

        padding-top: 0;
      }


      .hero-title {
        font-size: 4rem;
      }


      .enter-site {
        bottom: 40px;
      }

    }

  </style>

</head>


<body>

  <main class="hero">


    <!-- BACKGROUND VIDEO -->

    <video
      class="hero-video"
      autoplay
      loop
      muted
      playsinline
    >

      <source
        src="6456cc03b18521dd74a8f3ca_Short%20HYM-transcode.mp4"
        type="video/mp4"
      >

    </video>


    <!-- LOGO AND TITLE -->

    <div class="hero-content">


      <img
        class="hym-logo"
        src="hymlogo.png"
        alt="Holy Youth Movement"
      >


      <div class="title-wrapper">


        <div
          class="slice-heading hero-title"
          aria-label="Holy Youth Movement"
        >

          <span
            data-text="HOLY YOUTH"
          >
            HOLY YOUTH
          </span>


          <span
            data-text="MOVEMENT"
          >
            MOVEMENT
          </span>

        </div>


      </div>


    </div>


    <!-- ENTER SITE -->

    <a
      class="enter-site"
      href="home.html"
      aria-label="Enter site"
    >

      <span
        class="button-slice"
        data-text="ENTER SITE"
      >
        ENTER SITE
      </span>

    </a>


  </main>

</body>

</html>
