<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">

  <title>Holy Youth Movement</title>

  <style>
    :root {
      --pink: #ff20ef;
      --black: #000;
      --white: #fff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    .landing {
      position: relative;
      width: 100%;
      height: 100dvh;
      min-height: 100vh;
      overflow: hidden;
      background: #000;
      isolation: isolate;
    }

    /* -------------------------
       MOVING BACKGROUND
    ------------------------- */

    .background {
      position: absolute;
      inset: -10%;
      z-index: -5;

      background:
        radial-gradient(
          circle at 25% 30%,
          rgba(255, 32, 239, 0.28),
          transparent 30%
        ),
        radial-gradient(
          circle at 78% 62%,
          rgba(95, 0, 255, 0.20),
          transparent 28%
        ),
        radial-gradient(
          circle at 58% 20%,
          rgba(255, 255, 255, 0.05),
          transparent 20%
        ),
        linear-gradient(
          135deg,
          #030003 0%,
          #120010 34%,
          #020202 66%,
          #0c0010 100%
        );

      filter: contrast(1.2) saturate(1.2);

      animation:
        backgroundMove 14s ease-in-out infinite alternate,
        backgroundZoom 18s ease-in-out infinite alternate;
    }

    @keyframes backgroundMove {
      0% {
        transform: translate3d(-2%, -2%, 0) rotate(-1deg);
      }

      50% {
        transform: translate3d(3%, 1%, 0) rotate(1deg);
      }

      100% {
        transform: translate3d(-1%, 3%, 0) rotate(-0.5deg);
      }
    }

    @keyframes backgroundZoom {
      from {
        scale: 1;
      }

      to {
        scale: 1.1;
      }
    }

    /* -------------------------
       SOFT LIGHT BLOBS
    ------------------------- */

    .light {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.28;
      mix-blend-mode: screen;
      pointer-events: none;
    }

    .light-one {
      width: 42vw;
      height: 42vw;
      min-width: 260px;
      min-height: 260px;
      background: var(--pink);
      left: -10%;
      top: 12%;
      animation: driftOne 11s ease-in-out infinite alternate;
    }

    .light-two {
      width: 34vw;
      height: 34vw;
      min-width: 220px;
      min-height: 220px;
      background: #6e00ff;
      right: -8%;
      bottom: 8%;
      animation: driftTwo 13s ease-in-out infinite alternate;
    }

    @keyframes driftOne {
      from {
        transform: translate(0, 0) scale(0.9);
      }

      to {
        transform: translate(30vw, 18vh) scale(1.2);
      }
    }

    @keyframes driftTwo {
      from {
        transform: translate(0, 0) scale(1.1);
      }

      to {
        transform: translate(-24vw, -20vh) scale(0.8);
      }
    }

    /* -------------------------
       MOVING LIGHT STREAKS
    ------------------------- */

    .streak {
      position: absolute;
      width: 140%;
      height: 2px;
      left: -20%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.08),
        rgba(255,32,239,.5),
        transparent
      );
      filter: blur(0.6px);
      opacity: 0;
      transform: rotate(-12deg);
      animation: streakMove 7s linear infinite;
    }

    .streak-one {
      top: 25%;
      animation-delay: 1s;
    }

    .streak-two {
      top: 62%;
      animation-delay: 4s;
    }

    @keyframes streakMove {
      0% {
        transform: translateX(-30%) rotate(-12deg);
        opacity: 0;
      }

      15% {
        opacity: .65;
      }

      55% {
        opacity: .2;
      }

      100% {
        transform: translateX(45%) rotate(-12deg);
        opacity: 0;
      }
    }

    /* -------------------------
       GRAIN / FILM TEXTURE
    ------------------------- */

    .grain {
      position: absolute;
      inset: -60%;
      z-index: 5;
      pointer-events: none;
      opacity: .13;
      mix-blend-mode: screen;

      background-image:
        repeating-radial-gradient(
          circle at 0 0,
          transparent 0,
          rgba(255,255,255,.35) 1px,
          transparent 2px
        );

      background-size: 5px 5px;

      animation: grainShift .22s steps(2) infinite;
    }

    @keyframes grainShift {
      0% {
        transform: translate(0, 0);
      }

      25% {
        transform: translate(2%, -3%);
      }

      50% {
        transform: translate(-3%, 2%);
      }

      75% {
        transform: translate(3%, 3%);
      }

      100% {
        transform: translate(-2%, -1%);
      }
    }

    /* -------------------------
       VIGNETTE
    ------------------------- */

    .vignette {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;

      background:
        radial-gradient(
          circle at center,
          transparent 28%,
          rgba(0,0,0,.2) 55%,
          rgba(0,0,0,.82) 100%
        );
    }

    /* -------------------------
       FLASH / FLICKER
    ------------------------- */

    .flicker {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background: rgba(255,255,255,.07);
      opacity: 0;

      animation: flicker 8s infinite;
    }

    @keyframes flicker {
      0%, 18%, 20%, 21%, 43%, 45%, 100% {
        opacity: 0;
      }

      19% {
        opacity: .06;
      }

      20.5% {
        opacity: .12;
      }

      44% {
        opacity: .04;
      }
    }

    /* -------------------------
       MAIN CONTENT
    ------------------------- */

    .content {
      position: relative;
      z-index: 10;

      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 26px;

      text-align: center;
    }

    .logo-wrap {
      opacity: 0;
      transform: scale(.9);
      animation: logoReveal 1.4s ease forwards;
      animation-delay: .9s;
    }

    @keyframes logoReveal {
      0% {
        opacity: 0;
        transform: scale(.86);
        filter: blur(12px);
      }

      60% {
        opacity: 1;
        transform: scale(1.04);
        filter: blur(0);
      }

      100% {
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
      }
    }

    .hym {
      color: var(--pink);

      font-family: Arial Black, Arial, Helvetica, sans-serif;
      font-style: italic;
      font-weight: 900;

      font-size: clamp(92px, 24vw, 190px);

      line-height: .76;
      letter-spacing: -.12em;

      padding-right: .1em;

      text-shadow:
        0 0 8px rgba(255,32,239,.55),
        0 0 24px rgba(255,32,239,.34),
        0 0 70px rgba(255,32,239,.16);

      animation: logoPulse 5s ease-in-out infinite alternate;
    }

    @keyframes logoPulse {
      from {
        text-shadow:
          0 0 8px rgba(255,32,239,.5),
          0 0 24px rgba(255,32,239,.25),
          0 0 55px rgba(255,32,239,.12);
      }

      to {
        text-shadow:
          0 0 12px rgba(255,32,239,.75),
          0 0 34px rgba(255,32,239,.45),
          0 0 90px rgba(255,32,239,.2);
      }
    }

    .band-name {
      margin-top: 44px;

      color: white;

      font-size: clamp(13px, 3.9vw, 20px);
      font-weight: 600;

      letter-spacing: .32em;
      padding-left: .32em;

      white-space: nowrap;

      opacity: 0;
      transform: translateY(18px);

      animation: textReveal 1s ease forwards;
      animation-delay: 1.8s;
    }

    .enter-button {
      margin-top: 50px;

      min-width: 235px;
      height: 76px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border: 2px solid rgba(255,255,255,.9);

      background: rgba(0,0,0,.18);

      backdrop-filter: blur(4px);

      color: white;

      text-decoration: none;

      font-size: 17px;

      letter-spacing: .2em;

      opacity: 0;
      transform: translateY(22px);

      animation: buttonReveal 1.2s ease forwards;
      animation-delay: 2.7s;

      transition:
        background .25s ease,
        color .25s ease,
        border-color .25s ease,
        transform .25s ease,
        box-shadow .25s ease;
    }

    @keyframes textReveal {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes buttonReveal {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .enter-button:hover {
      color: #000;
      background: var(--pink);
      border-color: var(--pink);

      box-shadow:
        0 0 18px rgba(255,32,239,.45),
        0 0 45px rgba(255,32,239,.22);
    }

    .enter-button:active {
      transform: scale(.97);
    }

    /* -------------------------
       SMALL BOTTOM DETAIL
    ------------------------- */

    .bottom-line {
      position: absolute;
      bottom: 20px;
      left: 50%;
      z-index: 10;

      width: 1px;
      height: 48px;

      background: linear-gradient(
        to bottom,
        rgba(255,255,255,.65),
        transparent
      );

      opacity: 0;

      animation: bottomReveal 1s ease forwards;
      animation-delay: 3.4s;
    }

    @keyframes bottomReveal {
      from {
        opacity: 0;
        transform: translate(-50%, 10px);
      }

      to {
        opacity: .6;
        transform: translate(-50%, 0);
      }
    }

    /* -------------------------
       REDUCED MOTION
    ------------------------- */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }

    @media (max-width: 420px) {
      .content {
        padding: 20px;
      }

      .band-name {
        margin-top: 36px;
        font-size: 13px;
        letter-spacing: .27em;
      }

      .enter-button {
        margin-top: 42px;
        min-width: 215px;
        height: 70px;
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <main class="landing">

    <div class="background"></div>

    <div class="light light-one"></div>
    <div class="light light-two"></div>

    <div class="streak streak-one"></div>
    <div class="streak streak-two"></div>

    <div class="flicker"></div>
    <div class="vignette"></div>
    <div class="grain"></div>

    <div class="content">

      <div class="logo-wrap">

        <div class="hym">
          HYM
        </div>

      </div>

      <div class="band-name">
        HOLY YOUTH MOVEMENT
      </div>

      <a
        class="enter-button"
        href="home.html"
      >
        ENTER SITE
      </a>

    </div>

    <div class="bottom-line"></div>

  </main>

</body>
</html>
