<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HYM Poster Text Generator</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --black: #000;
      --charcoal: #25282b;
      --white: #fff;
      --pink: #fb38fc;
      --soft-white: rgba(255,255,255,.72);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      padding: 30px 20px 50px;
      color: var(--white);
      background: var(--charcoal);
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
    }

    .app-title {
      margin-bottom: 8px;
      font-family: "Archivo Black", "Arial Black", Arial, sans-serif;
      font-size: 28px;
      line-height: 1.1;
      letter-spacing: -.04em;
      text-transform: uppercase;
    }

    .app-intro {
      margin-bottom: 30px;
      color: var(--soft-white);
      font-size: 14px;
      line-height: 1.5;
    }


    /* CONTROLS */

    .controls {
      width: 100%;
      margin-bottom: 28px;
      padding: 22px;
      border: 2px solid var(--pink);
    }

    .control-group {
      margin-bottom: 22px;
    }

    .control-group:last-child {
      margin-bottom: 0;
    }

    .control-label {
      display: block;
      margin-bottom: 8px;
      color: var(--white);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    textarea {
      width: 100%;
      min-height: 110px;
      padding: 14px;
      resize: vertical;
      color: var(--white);
      background: #111;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 0;
      outline: none;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      line-height: 1.4;
    }

    textarea:focus {
      border-color: var(--pink);
    }

    .size-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .size-slider {
      flex: 1;
      accent-color: var(--pink);
    }

    .size-value {
      min-width: 65px;
      color: var(--white);
      font-size: 14px;
      text-align: right;
    }

    .colour-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .colour-button {
      min-height: 48px;
      padding: 10px 8px;
      color: var(--white);
      background: transparent;
      border: 2px solid rgba(255,255,255,.3);
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .colour-button.active {
      border-color: var(--pink);
    }

    .colour-swatch {
      display: inline-block;
      width: 13px;
      height: 13px;
      margin-right: 6px;
      border: 1px solid rgba(255,255,255,.45);
      vertical-align: -2px;
    }

    .swatch-white {
      background: #fff;
    }

    .swatch-pink {
      background: #fb38fc;
    }

    .swatch-black {
      background: #000;
    }


    /* PREVIEW */

    .preview-label {
      margin-bottom: 8px;
      color: var(--soft-white);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .preview-shell {
      position: relative;
      width: 100%;
      min-height: 330px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.2);

      background:
        linear-gradient(45deg, #333 25%, transparent 25%),
        linear-gradient(-45deg, #333 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #333 75%),
        linear-gradient(-45deg, transparent 75%, #333 75%);

      background-color: #222;

      background-position:
        0 0,
        0 10px,
        10px -10px,
        -10px 0;

      background-size: 20px 20px;
    }

    .preview-stage {
      width: 100%;
      padding: 45px 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }


    /*
      ==================================================
      ACTUAL HYM TYPOGRAPHY

      This is based directly on style.css.
      ==================================================
    */

    .hym-line {
      position: relative;

      display: block;

      width: 100%;

      color: transparent;

      text-align: center;

      font-family:
        "Archivo Black",
        "Arial Black",
        Arial,
        sans-serif;

      font-weight: 400;

      letter-spacing: -.075em;

      text-transform: uppercase;

      transform: skewX(-9deg);

      transform-origin: center;

      white-space: nowrap;
    }

    .hym-line::before,
    .hym-line::after {
      content: attr(data-text);

      position: absolute;

      top: 0;
      left: 50%;

      width: max-content;

      color: var(--hym-colour, #fff);

      font: inherit;

      line-height: inherit;

      letter-spacing: inherit;

      text-align: center;

      white-space: nowrap;

      -webkit-text-stroke:
        var(--hym-stroke, .3px)
        var(--hym-colour, #fff);
    }


    /*
      EXACT WEBSITE CLIPPING
    */

    .hym-line::before {
      clip-path:
        polygon(
          0 0,
          100% 0,
          100% 48%,
          0 57%
        );

      transform:
        translateX(
          calc(-50% - var(--slice-offset))
        );
    }

    .hym-line::after {
      clip-path:
        polygon(
          0 57%,
          100% 48%,
          100% 100%,
          0 100%
        );

      transform:
        translateX(
          calc(-50% + var(--slice-offset))
        );
    }


    /* EXPORT */

    .export-button {
      width: 100%;
      min-height: 58px;
      padding: 12px 20px;

      color: var(--white);
      background: transparent;

      border: 3px solid var(--pink);

      cursor: pointer;

      font-family:
        "Archivo Black",
        "Arial Black",
        Arial,
        sans-serif;

      font-size: 19px;
      line-height: 1;

      letter-spacing: -.04em;

      text-transform: uppercase;
    }

    .export-button:hover {
      color: var(--pink);
    }

    .download-note {
      margin-top: 12px;

      color: var(--soft-white);

      font-size: 12px;
      line-height: 1.5;

      text-align: center;
    }


    /*
      Hidden export area.

      This uses exactly the same HTML/CSS treatment
      as the visible preview.
    */

    .export-area {
      position: fixed;

      left: -10000px;
      top: 0;

      display: inline-flex;
      flex-direction: column;
      align-items: center;

      padding: 100px;

      background: transparent;

      pointer-events: none;
    }


    @media (min-width: 700px) {

      body {
        padding: 50px 40px 70px;
      }

      .app-title {
        font-size: 36px;
      }

      .controls {
        padding: 30px;
      }

      .preview-shell {
        min-height: 420px;
      }

    }

  </style>
</head>

<body>

  <main class="app">

    <h1 class="app-title">
      HYM Poster Text Generator
    </h1>

    <p class="app-intro">
      Create HYM-style sliced headings for posters and artwork.
      Exported images have a transparent background.
    </p>


    <section class="controls">

      <div class="control-group">

        <label
          class="control-label"
          for="textInput"
        >
          Text
        </label>

        <textarea
          id="textInput"
          spellcheck="false"
        >HOLY YOUTH
MOVEMENT</textarea>

      </div>


      <div class="control-group">

        <label
          class="control-label"
          for="sizeSlider"
        >
          Text size
        </label>

        <div class="size-row">

          <input
            class="size-slider"
            id="sizeSlider"
            type="range"
            min="30"
            max="160"
            value="60"
          >

          <span
            class="size-value"
            id="sizeValue"
          >
            60px
          </span>

        </div>

      </div>


      <div class="control-group">

        <span class="control-label">
          Colour
        </span>

        <div class="colour-buttons">

          <button
            class="colour-button active"
            type="button"
            data-colour="#ffffff"
          >
            <span
              class="colour-swatch swatch-white"
            ></span>
            White
          </button>

          <button
            class="colour-button"
            type="button"
            data-colour="#fb38fc"
          >
            <span
              class="colour-swatch swatch-pink"
            ></span>
            Pink
          </button>

          <button
            class="colour-button"
            type="button"
            data-colour="#000000"
          >
            <span
              class="colour-swatch swatch-black"
            ></span>
            Black
          </button>

        </div>

      </div>

    </section>


    <p class="preview-label">
      Preview
    </p>


    <div class="preview-shell">

      <div
        class="preview-stage"
        id="previewStage"
      ></div>

    </div>


    <button
      class="export-button"
      id="exportButton"
      type="button"
    >
      Export Transparent PNG
    </button>


    <p class="download-note">
      Transparent PNG for use in posters and artwork.
    </p>

  </main>


  <div
    class="export-area"
    id="exportArea"
  ></div>


  <!--
    html2canvas is used only to turn the CSS-rendered
    HYM lettering into a transparent PNG.
  -->

  <script
    src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"
  ></script>


  <script>

    const textInput =
      document.getElementById("textInput");

    const sizeSlider =
      document.getElementById("sizeSlider");

    const sizeValue =
      document.getElementById("sizeValue");

    const colourButtons =
      document.querySelectorAll(".colour-button");

    const previewStage =
      document.getElementById("previewStage");

    const exportArea =
      document.getElementById("exportArea");

    const exportButton =
      document.getElementById("exportButton");


    let currentColour = "#ffffff";


    function getLines() {

      return textInput.value
        .toUpperCase()
        .split("\n")
        .map(line => line.trim());

    }


    function calculateSettings(fontSize) {

      /*
        Website:
        82px font
        84px line-height
        2px slice movement
        .3px stroke

        Scale those values proportionally when the
        poster generator's font size changes.
      */

      const scale = fontSize / 82;

      return {
        lineHeight: 84 * scale,
        sliceOffset: 2 * scale,
        stroke: Math.max(.2, .3 * scale)
      };

    }


    function createLine(
      text,
      fontSize,
      colour
    ) {

      const settings =
        calculateSettings(fontSize);

      const line =
        document.createElement("div");

      line.className = "hym-line";

      line.textContent = text;

      line.dataset.text = text;

      line.style.fontSize =
        `${fontSize}px`;

      line.style.lineHeight =
        `${settings.lineHeight}px`;

      line.style.height =
        `${settings.lineHeight}px`;

      line.style.setProperty(
        "--slice-offset",
        `${settings.sliceOffset}px`
      );

      line.style.setProperty(
        "--hym-colour",
        colour
      );

      line.style.setProperty(
        "--hym-stroke",
        `${settings.stroke}px`
      );

      return line;

    }


    function buildText(
      container,
      fontSize,
      colour
    ) {

      container.innerHTML = "";

      const lines = getLines();

      lines.forEach(text => {

        if (!text) {

          const spacer =
            document.createElement("div");

          spacer.style.height =
            `${fontSize * 1.024}px`;

          container.appendChild(spacer);

          return;

        }

        container.appendChild(
          createLine(
            text,
            fontSize,
            colour
          )
        );

      });

    }


    function renderPreview() {

      const fontSize =
        Number(sizeSlider.value);

      sizeValue.textContent =
        `${fontSize}px`;

      buildText(
        previewStage,
        fontSize,
        currentColour
      );

    }


    textInput.addEventListener(
      "input",
      renderPreview
    );


    sizeSlider.addEventListener(
      "input",
      renderPreview
    );


    colourButtons.forEach(button => {

      button.addEventListener(
        "click",
        () => {

          colourButtons.forEach(item => {
            item.classList.remove("active");
          });

          button.classList.add("active");

          currentColour =
            button.dataset.colour;

          renderPreview();

        }
      );

    });


    async function exportPNG() {

      exportButton.disabled = true;

      exportButton.textContent =
        "CREATING PNG...";


      await document.fonts.ready;


      /*
        Use a larger scale for the export than the
        on-screen preview.

        This keeps the artwork sharp when placed
        into a poster.
      */

      const previewFontSize =
        Number(sizeSlider.value);

      const exportFontSize =
        previewFontSize * 4;


      buildText(
        exportArea,
        exportFontSize,
        currentColour
      );


      /*
        Find the actual width of the longest line.
      */

      const lines =
        exportArea.querySelectorAll(".hym-line");

      let widest = 0;


      lines.forEach(line => {

        const beforeWidth =
          line.scrollWidth;

        if (beforeWidth > widest) {
          widest = beforeWidth;
        }

      });


      /*
        Give the artwork breathing room so the skew
        and sliced halves cannot be cropped.
      */

      const exportWidth =
        Math.max(
          600,
          Math.ceil(widest + 300)
        );


      exportArea.style.width =
        `${exportWidth}px`;


      /*
        Rebuild once the final width is known so
        everything centres correctly.
      */

      buildText(
        exportArea,
        exportFontSize,
        currentColour
      );


      try {

        const canvas =
          await html2canvas(
            exportArea,
            {
              backgroundColor: null,
              scale: 1,
              useCORS: true,
              logging: false
            }
          );


        const link =
          document.createElement("a");

        link.download =
          "hym-poster-text.png";

        link.href =
          canvas.toDataURL("image/png");

        link.click();

      } catch (error) {

        console.error(error);

        alert(
          "The PNG could not be created. Please try again."
        );

      }


      exportButton.disabled = false;

      exportButton.textContent =
        "EXPORT TRANSPARENT PNG";

    }


    exportButton.addEventListener(
      "click",
      exportPNG
    );


    document.fonts.ready.then(() => {
      renderPreview();
    });

  </script>

</body>
</html>
